<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asistencia Obligatorio</title>

    <style>
        body{
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            background:#f0f2f5;
            display:flex;
            justify-content:center;
            align-items:flex-start; /* Cambiado para permitir scroll */
            min-height:100vh; /* Cambiado de height a min-height */
            margin:0;
            padding:20px 0;
            overflow-y:auto; /* Permite scroll en la página */
        }

        .container{
            background:#fff;
            padding:30px;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,.15);
            width:100%;
            max-width:500px;
            box-sizing:border-box;
            margin:20px auto;
        }

        h2{
            text-align:center;
            color:#1a73e8;
            margin-top:0;
        }

        .instructions{
            font-size:13px;
            color:#5f6368;
            line-height:1.5;
            margin-bottom:20px;
            text-align:justify;
            background:#e8f0fe;
            padding:12px;
            border-radius:6px;
        }

        .form-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            font-weight:bold;
            margin-bottom:5px;
        }

        select{
            width:100%;
            padding:10px;
            border:1px solid #dadce0;
            border-radius:6px;
            box-sizing:border-box;
        }

        .radio-group{
            display:flex;
            gap:20px;
        }

        .radio-option{
            display:flex;
            align-items:center;
            gap:5px;
        }

        button{
            width:100%;
            background:#1a73e8;
            color:white;
            border:none;
            padding:12px;
            border-radius:6px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            margin-top:10px;
            transition: background 0.3s;
        }

        button:hover{
            background:#1557b0;
        }

        button:disabled{
            background:#ccc;
            cursor:not-allowed;
        }

        /* ===== NUEVO: MENSAJE DE ÉXITO ===== */
        #mensaje-exito {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            border: 1px solid #c3e6cb;
            text-align: center;
            font-weight: bold;
            scroll-margin-top: 20px; /* Para que no quede pegado arriba */
        }

        #mensaje-exito .icono {
            font-size: 30px;
            display: block;
            margin-bottom: 5px;
        }

        /* ===== NUEVO: LOADING MEJORADO ===== */
        #loading{
            display:none;
            text-align:center;
            color:#1a73e8;
            font-weight:bold;
            margin-top:15px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== NUEVO: SCROLL SUAVE ===== */
        html {
            scroll-behavior: smooth;
        }

        /* Responsive para móviles */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            .radio-group {
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

<h2>Registro de Asistencia Estudiantes</h2>

<div class="instructions">
<strong>Estimad@ Estudiante:</strong><br>
Seleccione la información solicitada para registrar su asistencia al laboratorio.
</div>

<!-- ===== NUEVO: MENSAJE DE ÉXITO ===== -->
<div id="mensaje-exito">
    <span class="icono">✅</span>
    ¡Registro exitoso!<br>
    <small style="font-weight:normal;">La página se recargará en unos segundos...</small>
</div>

<form id="attendanceForm">

<div class="form-group">
<label for="laboratorio">Laboratorio Actual:</label>

<select id="laboratorio" name="laboratorio" required>
<option value="" selected disabled>Seleccione...</option>
<option value="Laboratorio C1">Laboratorio C1</option>
<option value="Laboratorio C2">Laboratorio C2</option>
<option value="Laboratorio C3">Laboratorio C3</option>
<option value="Laboratorio G1">Laboratorio G1</option>
<option value="Laboratorio G2">Laboratorio G2</option>
</select>

</div>

<div class="form-group">
<label>Género:</label>

<div class="radio-group">
<div class="radio-option">
<input type="radio" name="genero" value="M" required> M
</div>

<div class="radio-option">
<input type="radio" name="genero" value="H" required> H
</div>
</div>
</div>

<div class="form-group">
<label for="facultad">Facultad:</label>

<select id="facultad" name="facultad" required>
    <option value="" selected disabled>Seleccione una facultad...</option>

    <option value="Facultad de Ciencias Económicas y Administrativas">
        Facultad de Ciencias Económicas y Administrativas
    </option>

    <option value="Facultad de Ingeniería y Arquitectura">
        Facultad de Ingeniería y Arquitectura
    </option>

    <option value="Facultad de Arte, Diseño y Comunicación">
        Facultad de Arte, Diseño y Comunicación
    </option>

    <option value="Facultad de Ciencias Jurídicas y Sociales">
        Facultad de Ciencias Jurídicas y Sociales
    </option>

    <option value="Facultad de Ciencias Médicas">
        Facultad de Ciencias Médicas
    </option>

    <option value="Facultad de Odontología">
        Facultad de Odontología
    </option>

    <option value="Facultad de Humanidades">
        Facultad de Humanidades
    </option>

    <option value="Novus">
        Novus
    </option>

</select>
</div>

<div class="form-group">
<label for="carrera">Carrera:</label>

<select id="carrera" name="carrera" required disabled>
<option value="" selected disabled>Primero seleccione una facultad...</option>
</select>

</div>

<div class="form-group">

<label for="motivo">¿A qué vienes al laboratorio?</label>

<select id="motivo" name="motivo" required>

<option value="" selected disabled>Seleccione...</option>

<option value="A mi clase normal de hoy">
A mi clase normal de hoy
</option>

<option value="A usar la máquina libre (fuera de clase / tareas)">
A usar la máquina libre (fuera de clase / tareas)
</option>

</select>

</div>

<button type="submit" id="btnEnviar">Enviar</button>

<div id="loading">
    <span class="spinner"></span>
    Enviando registro...
</div>

</form>

</div>

<script>

const carreras = {

"Facultad de Ciencias Económicas y Administrativas":[
"Administración de Empresas",
"Contabilidad y Finanzas",
"Marketing y Publicidad"
],

"Facultad de Ingeniería y Arquitectura":[
"Arquitectura",
"Ingeniería Industrial"
],

"Facultad de Arte, Diseño y Comunicación":[
"Arte Digital y Animación"
],

"Facultad de Ciencias Jurídicas y Sociales":[
"Derecho",
"Relaciones Internacionales y Comercio Internacional"
],

"Facultad de Ciencias Médicas":[
"Medicina General",
"Psicología"
],

"Facultad de Odontología":[
"Odontología"
],

"Facultad de Humanidades":[
"Pedagogía"
]

};

const facultad=document.getElementById("facultad");
const carrera=document.getElementById("carrera");

facultad.addEventListener("change",function(){

const lista=carreras[this.value];

carrera.innerHTML='<option value="" selected disabled>Seleccione una carrera...</option>';

lista.forEach(function(item){

const option=document.createElement("option");
option.value=item;
option.textContent=item;
carrera.appendChild(option);

});

carrera.disabled=false;

});

const scriptURL='https://script.google.com/macros/s/AKfycbygZKwf_phc18U1SgJxa2TBzIxBmPhf2al-LvKOy_YvYUjbvP8NsI9MaNHI2IE-VsFe/exec';

const form=document.getElementById("attendanceForm");
const btn=document.getElementById("btnEnviar");
const loading=document.getElementById("loading");
const mensajeExito = document.getElementById("mensaje-exito");

form.addEventListener("submit", e => {

e.preventDefault();

// Deshabilitar botón y mostrar loading
btn.disabled = true;
loading.style.display = "block";
mensajeExito.style.display = "none"; // Ocultar mensaje anterior si existía

// Enviar datos con fetch
fetch(scriptURL, {
    method: "POST",
    body: new FormData(form),
    mode: "no-cors" // Importante para Google Apps Script
})

.then(response => {
    
    // Ocultar loading
    loading.style.display = "none";
    
    // ✅ MOSTRAR MENSAJE DE ÉXITO
    mensajeExito.style.display = "block";
    
    // 🔥 SCROLL AUTOMÁTICO AL MENSAJE (para móviles)
    mensajeExito.scrollIntoView({ 
        behavior: 'smooth', 
        block: 'center' 
    });
    
    // ⏰ RECARGAR LA PÁGINA DESPUÉS DE 2.5 SEGUNDOS
    setTimeout(function() {
        location.reload(); // Recarga la página para poder enviar otro registro
    }, 2500);

})

.catch(error => {
    
    // Ocultar loading
    loading.style.display = "none";
    
    // Mostrar error
    alert("Error de conexión. Por favor, intenta de nuevo.");
    
    // Reactivar botón
    btn.disabled = false;
    
    console.error("Error:", error);
    
});

});

</script>

</body>
</html>
